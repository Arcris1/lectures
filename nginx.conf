server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The page is one large self-contained file; compression is the whole
    # difference between a 3 MB and a ~500 KB transfer.
    gzip on;
    gzip_types text/html text/plain;
    gzip_min_length 1024;

    # Single file, no directory listing, no server tokens.
    autoindex off;
    server_tokens off;

    location / {
        try_files /index.html =404;
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }
}
